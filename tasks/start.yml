- name: Creating symlinks which will start the serviccse
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
  loop:
    - src: "{{ djbdns_tinydns_conf_dir }}"
      dest: /etc/service/tinydns
    - src: "{{ djbdns_axfr_conf_dir }}"
      dest: /etc/service/axfrdns
