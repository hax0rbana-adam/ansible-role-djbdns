- name: Compile zone transfer rules into a hashed database
  when: not xfer_db.stat.exists or xfer_conf.stat.mtime > xfer_db.stat.mtime
  ansible.builtin.command:
    cmd: make
    chdir: "{{ djbdns_axfr_conf_dir }}"
  register: xfer_rebuild
  changed_when: '"is up to date." not in xfer_rebuild.stdout'

- name: Compile zone file into a hashed database
  when: not data_db.stat.exists or data_conf.stat.mtime > data_db.stat.mtime
  ansible.builtin.command:
    cmd: make
    chdir: "{{ djbdns_tinydns_conf_dir }}/root"
  register: data_rebuild
  changed_when: '"is up to date." not in data_rebuild.stdout'
